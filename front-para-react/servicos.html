<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Serviços · GAMEDEAL</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="app.js" defer></script>
</head>
<body class="with-nav">
  <div class="app">
    <header class="topbar">
      <h1>Serviços Gaming</h1>
      <button class="icon-btn" aria-label="Filtros"><svg class="ic"><use href="#i-sliders" /></svg></button>
    </header>

    <main class="screen">
      <div class="chips" data-group>
        <button class="chip active">Todos os Serviços</button>
        <button class="chip">Upar</button>
        <button class="chip">Coaching</button>
        <button class="chip">Dungeons</button>
        <button class="chip">Rank Boost</button>
      </div>

      <section class="grid lg-grid-3">
        <article class="card stack" style="gap:12px">
          <div class="row between">
            <div class="row" style="gap:8px"><span class="avatar"></span><span style="font-weight:600">Nick</span></div>
            <span class="stars">★ 5.0</span>
          </div>
          <p>Descrição do serviço</p>
          <span class="tag tag-muted">Jogo</span>
          <hr class="divider" />
          <div class="row between">
            <div class="stack" style="gap:2px">
              <span class="muted" style="font-size:12px">A partir de</span>
              <span class="price">R$ Valor</span>
            </div>
            <button class="btn btn-primary btn-sm">Contratar</button>
          </div>
        </article>

        <article class="card stack" style="gap:12px">
          <div class="row between">
            <div class="row" style="gap:8px"><span class="avatar"></span><span style="font-weight:600">Nick</span></div>
            <span class="stars">★ 5.0</span>
          </div>
          <p>Descrição do serviço</p>
          <span class="tag tag-muted">Jogo</span>
          <hr class="divider" />
          <div class="row between">
            <div class="stack" style="gap:2px">
              <span class="muted" style="font-size:12px">A partir de</span>
              <span class="price">R$ Valor</span>
            </div>
            <button class="btn btn-primary btn-sm">Contratar</button>
          </div>
        </article>

        <article class="card stack" style="gap:12px">
          <div class="row between">
            <div class="row" style="gap:8px"><span class="avatar"></span><span style="font-weight:600">Nick</span></div>
            <span class="stars">★ 5.0</span>
          </div>
          <p>Descrição do serviço</p>
          <span class="tag tag-muted">Jogo</span>
          <hr class="divider" />
          <div class="row between">
            <div class="stack" style="gap:2px">
              <span class="muted" style="font-size:12px">A partir de</span>
              <span class="price">R$ Valor</span>
            </div>
            <button class="btn btn-primary btn-sm">Contratar</button>
          </div>
        </article>
      </section>
    </main>

    <nav class="bottom-nav">
      <a href="inicio.html"><svg class="ic"><use href="#i-house" /></svg>Início</a>
      <a class="active" href="servicos.html"><svg class="ic"><use href="#i-zap" /></svg>Serviços</a>
      <a href="categoria-anuncio.html"><svg class="ic"><use href="#i-bag" /></svg>Vender</a>
      <a href="perfil.html"><svg class="ic"><use href="#i-user" /></svg>Perfil</a>
      <a href="finalizacao-venda.html"><svg class="ic"><use href="#i-cart" /></svg>Carrinho</a>
    </nav>
  </div>
</body>
</html>
