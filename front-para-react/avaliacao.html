<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Avaliar Vendedor · GAMEDEAL</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="app.js" defer></script>
</head>
<body class="with-nav">
  <div class="app">
    <header class="topbar">
      <a class="icon-btn" href="finalizacao-venda.html" aria-label="Voltar"><svg class="ic"><use href="#i-arrow-left" /></svg></a>
      <h1>Avaliar Vendedor</h1>
    </header>

    <main class="screen">
      <section class="card seller">
        <div class="row" style="gap:12px">
          <span class="avatar" style="width:48px;height:48px"></span>
          <div class="stack" style="gap:2px">
            <span style="font-weight:600">Nick</span>
            <span class="muted" style="font-size:13px">Nota 5.0 (128 avaliações)</span>
          </div>
        </div>
        <span class="tag">Vendedor Pro</span>
      </section>

      <section class="stack">
        <h2 class="h2">Sua Avaliação</h2>
        <div class="rating-input" data-rating>
          <button type="button" class="star" aria-label="1 estrela">★</button>
          <button type="button" class="star" aria-label="2 estrelas">★</button>
          <button type="button" class="star" aria-label="3 estrelas">★</button>
          <button type="button" class="star" aria-label="4 estrelas">★</button>
          <button type="button" class="star" aria-label="5 estrelas">★</button>
        </div>
      </section>

      <section class="field">
        <label for="comment">Escreva seu comentário</label>
        <textarea id="comment" class="input" placeholder="Conte sua experiência com este vendedor..."></textarea>
      </section>

      <section class="stack">
        <h2 class="h2">Como foi a experiência?</h2>
        <div class="row" style="flex-wrap:wrap;gap:8px">
          <button type="button" class="pick" aria-pressed="false" data-toggle>Entrega Rápida</button>
          <button type="button" class="pick" aria-pressed="false" data-toggle>Boa Comunicação</button>
          <button type="button" class="pick" aria-pressed="false" data-toggle>Item Conforme</button>
          <button type="button" class="pick" aria-pressed="false" data-toggle>Confiável</button>
          <button type="button" class="pick" aria-pressed="false" data-toggle>Recomendo</button>
        </div>
      </section>

      <button class="btn btn-primary" type="button">Enviar Avaliação</button>
    </main>

    <nav class="bottom-nav">
      <a href="inicio.html"><svg class="ic"><use href="#i-house" /></svg>Início</a>
      <a href="servicos.html"><svg class="ic"><use href="#i-zap" /></svg>Serviços</a>
      <a href="categoria-anuncio.html"><svg class="ic"><use href="#i-bag" /></svg>Vender</a>
      <a href="perfil.html"><svg class="ic"><use href="#i-user" /></svg>Perfil</a>
      <a href="finalizacao-venda.html"><svg class="ic"><use href="#i-cart" /></svg>Carrinho</a>
    </nav>
  </div>
</body>
</html>
